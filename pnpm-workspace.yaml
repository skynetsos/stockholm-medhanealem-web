# Packages allowed (true) or explicitly denied (false) to run install scripts. See docs/DECISIONS.md D-002.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Pulled in by next-intl for its optional message-extraction feature, which we don't use.
  "@parcel/watcher": false
  "@swc/core": false

# Security fixes for indirect dependencies (D-037): newer patch/minor releases of the same majors.
overrides:
  dompurify: ^3.4.17
  undici@7: ^7.30.1

# Advisories that only the Next.js 16 / Payload upgrade can fix (Payload supports Next.js <15.5 or
# >=16.3.3; no 15.4.x is patched). Known and tracked in D-037; remove this list with that upgrade.
# Everything else at "high" or above fails CI (pnpm audit --prod --audit-level=high).
auditConfig:
  ignoreGhsas:
    - GHSA-834v-8h66-3h79  # happy-dom high
    - GHSA-c8p4-j97h-3vg8  # happy-dom high
    - GHSA-p293-qw3h-jr36  # next critical
